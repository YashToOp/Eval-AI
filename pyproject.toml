[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-text-eval"
version = "2.0.0"
description = "An evaluation framework for AI-generated-text detection: supervised-primary ensemble, conformal false-positive control, ternary verdicts with abstention, span attribution, and robustness/fairness evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Eval-AI" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
# The core package is dependency-free. These extras enable the
# model-based detectors (GPT-2 perplexity, Binoculars-style cross-perplexity).
perplexity = ["torch", "transformers"]
dev = ["pytest"]

[project.scripts]
ai-text-eval = "ai_text_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_text_eval = ["data/*.jsonl", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

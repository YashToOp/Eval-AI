name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The core package is dependency-free, so the interesting risk is
        # Python version drift rather than dependency drift.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run tests
        run: pytest -q

      - name: Smoke-test the all-in-one runner
        run: |
          python -c "print(('The bus was late again and I waited about twenty minutes in the rain. Two other people gave up and walked. When it finally came the driver apologized and said the bridge was closed. ' * 4))" > sample.txt
          python analyze.py --file sample.txt
          python analyze.py --file sample.txt --json > /dev/null

      - name: Smoke-test the CLI
        run: |
          ai-text-eval detectors --fast
          ai-text-eval benchmark --fast
          ai-text-eval robustness --fast
          ai-text-eval fairness --fast
